<script>
/* Global search — loads build/tmp/searchindex.json (copied next to this
   page at build time) and renders Google-style results entirely offline. */
(function(){
  var input = document.getElementById('gSearch');
  var stats = document.getElementById('gStats');
  var out = document.getElementById('gResults');
  var INDEX_URL = 'searchindex.json';

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hi(text, q){
    if(!q) return esc(text);
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if(i === -1) return esc(text);
    return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
  }

  function run(q){
    q = q.trim();
    if(q.length < 2){ stats.textContent = 'Type at least 2 characters.'; out.innerHTML=''; return; }
    var ql = q.toLowerCase();
    var results = [];
    for(var i=0;i<DATA.length;i++){
      var g = DATA[i];
      var score = 0, bestChap = null, bestSnip = null;

      /* Title match = strongest */
      var ti = g.title.toLowerCase().indexOf(ql);
      if(ti !== -1) score += 100 - ti;

      /* Chapter heading matches */
      for(var c=0;c<g.chapters.length;c++){
        var ch = g.chapters[c];
        var ci = ch.text.toLowerCase().indexOf(ql);
        if(ci !== -1){
          var s = (ch.level===2 ? 40 : 30) - ci;
          if(s > score || !bestChap){ score = Math.max(score, s); bestChap = ch; }
        }
      }

      /* Snippet matches */
      for(var s2=0;s2<g.snippets.length;s2++){
        var si = g.snippets[s2].toLowerCase().indexOf(ql);
        if(si !== -1){ score = Math.max(score, 15 - si); if(!bestSnip) bestSnip = g.snippets[s2]; }
      }

      /* Haystack fallback (substring anywhere) */
      if(score === 0 && g.hay.indexOf(ql) !== -1) score = 5;

      if(score > 0) results.push({g:g, score:score, chap:bestChap, snip:bestSnip});
    }

    results.sort(function(a,b){ return b.score - a.score; });
    var top = results.slice(0, 30);

    if(!top.length){
      stats.textContent = 'No results for "' + q + '".';
      out.innerHTML = '<p class="am-hero-p">Try a shorter or more general term.</p>';
      return;
    }
    stats.textContent = top.length + ' result' + (top.length===1?'':'s') + ' for "' + q + '"';

    var html = '';
    top.forEach(function(r){
      var g = r.g;
      var url = g.file + (r.chap ? '#' + r.chap.id : '');
      html += '<div style="margin:14px 0; padding:14px 16px; background:var(--panel); border:1px solid var(--am-line); border-radius:var(--radius);">'
        + '<div style="font-size:12px; color:var(--muted); margin-bottom:4px;">amin360it.github.io/' + esc(g.file) + '</div>'
        + '<a href="' + url + '" style="font-size:16.5px; font-weight:700; color:var(--text); text-decoration:none;">' + hi(g.title, q) + '</a>'
        + (r.chap ? '<div style="font-size:13px; color:var(--accent); margin:2px 0 6px;">§ ' + hi(r.chap.text, q) + '</div>' : '')
        + '<div style="font-size:13.5px; color:var(--muted); line-height:1.5;">' + hi(r.snip || g.desc, q) + '</div>'
        + '</div>';
    });
    out.innerHTML = html;
  }

  var DATA = [];
  fetch(INDEX_URL).then(function(r){ return r.json(); }).then(function(j){
    DATA = j;
    stats.textContent = j.length + ' guides indexed — start typing above.';
    if(input.value.trim().length >= 2) run(input.value);
  }).catch(function(){
    stats.textContent = 'Index failed to load. Make sure searchindex.json sits next to search.html.';
  });

  var t;
  input.addEventListener('input', function(){
    clearTimeout(t);
    t = setTimeout(function(){ run(input.value); }, 180);
  });
})();
</script>
